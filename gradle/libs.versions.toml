[versions]
agp = "9.2.0"
kotlin = "2.4.10"
ksp = "2.3.13"

android-compileSdk = "37"
android-compileSdkMinor = "0" # the installed platform is android-37.0
android-minSdk = "31" # Android 12: Material You dynamic color is always available
android-targetSdk = "36"

androidx-activity = "1.12.2"
androidx-core = "1.17.0"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.1"
androidx-room = "2.8.5"
compose = "1.12.0"
material3 = "1.5.0-alpha22" # Expressive APIs (MaterialExpressiveTheme, MotionScheme, ShortNavigationBar…)
material3-adaptive = "1.2.0"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.10.0"
coil = "3.5.0-beta01"
ktor = "3.4.1"
vico = "3.3.1" # charts (Material 3 themed)
health-connect = "1.1.0"
camerax = "1.4.2" # the camera rep counter
mlkit-pose = "18.0.0-beta5" # on-device pose detection for the camera rep counter # writes finished workouts and body weight to Health Connect

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

# Compose
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version = "1.7.6" }

# Navigation
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }

# Data
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Exercise visuals
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" } # plays ExerciseDB's animated demos
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" } # wger's muscle images
# Lets Coil load images from the network (it picks the network module up automatically).
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

# Camera rep counter
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-pose-detection = { module = "com.google.mlkit:pose-detection", version.ref = "mlkit-pose" }

# Health Connect
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "health-connect" }

# Charts
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# Lists
reorderable = { module = "sh.calvin.reorderable:reorderable", version = "3.0.0" } # drag to reorder in the routine editor

# Tests
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "androidx-room" }
