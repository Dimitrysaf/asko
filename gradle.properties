#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m
org.gradle.configuration-cache=true
org.gradle.caching=true
# Leave headroom for the desktop: cap concurrent workers below core count and
# run the daemon at low CPU priority so builds can't starve the UI.
org.gradle.workers.max=4
org.gradle.priority=low

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
